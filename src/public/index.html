<!DOCTYPE html>

<html>
<head>
<title>Email Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  display:flex;
  background:#f1f5f9;
}

.sidebar {
  width:220px;
  background:#1e293b;
  color:white;
  padding:20px;
}

.main {
  flex:1;
  padding:30px;
}

.card {
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:900px;
  margin:auto;
}

.stats {
  display:flex;
  justify-content:space-between;
}

.stat {
  background:#e2e8f0;
  padding:10px;
  border-radius:8px;
  width:30%;
  text-align:center;
  font-weight:bold;
}

.upload-box {
  border:2px dashed #ccc;
  padding:15px;
  margin:10px 0;
  cursor:pointer;
  border-radius:10px;
  text-align:center;
}

input[type=file]{display:none;}

input, textarea {
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:12px;
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:bold;
}

.preview {
  background:#f3f4f6;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.bar {
  height:20px;
  background:#ddd;
  border-radius:10px;
}

.fill {
  height:100%;
  width:0%;
  background:#22c55e;
}

</style>

</head>

<body>

<div class="sidebar">
<h2>Admin</h2>
<a href="/logout" style="color:white;">Logout</a>
</div>

<div class="main">

<div class="card">

<h2>📧 Email Dashboard</h2>

<div class="stats">
<div class="stat" id="totalBox">Total:0</div>
<div class="stat" id="sentBox">Sent:0</div>
<div class="stat" id="failBox">Failed:0</div>
</div>

<form id="form">

<div class="upload-box" onclick="excel.click()">📊 Upload Excel <p id="excelName"></p></div>
<input type="file" id="excel" name="file">

<div class="upload-box" onclick="attach.click()">📎 Upload Files <p id="attachName"></p></div>
<input type="file" id="attach" name="attachments" multiple>

<input name="subject" placeholder="Subject">

<textarea name="message" placeholder="Message"></textarea>

<input name="registerLink" placeholder="Register Link">
<input name="whatsappLink" placeholder="WhatsApp Channel">
<input name="whatsappGroupLink" placeholder="WhatsApp Group">
<input name="youtubeLink" placeholder="YouTube">

<button id="btn">Send Emails</button>

</form>

<div class="bar"><div class="fill" id="bar"></div></div>

<h3 id="status">Waiting...</h3>

<h3>📧 Live Preview</h3>
<div class="preview" id="preview"></div>

<h3>📊 Chart</h3>
<canvas id="chart"></canvas>

<button onclick="downloadLogs()">⬇ Export Logs</button>

</div>
</div>

<script>

excel.onchange=async()=>{
excelName.innerText=excel.files[0].name;

const d=new FormData();
d.append("file",excel.files[0]);

const r=await fetch("/count-emails",{method:"POST",body:d});
const j=await r.json();

totalBox.innerText="Total:"+j.total;
};

attach.onchange=()=>{
attachName.innerText=Array.from(attach.files).map(f=>f.name).join(",");
};

// 🔥 LIVE MESSAGE PREVIEW
form.message.oninput=()=>{
preview.innerHTML=form.message.value.replace(/\n/g,"<br>");
};

form.onsubmit=async(e)=>{
e.preventDefault();

btn.disabled=true;
btn.innerText="Sending...";

const data=new FormData(form);

const res=await fetch("/send-bulk-live",{method:"POST",body:data});
const reader=res.body.getReader();
const decoder=new TextDecoder();

let sent=0,failed=0;

status.innerText="Sending...";

while(true){
const {done,value}=await reader.read();
if(done)break;

const obj=JSON.parse(decoder.decode(value));

sent=obj.sent;
failed=obj.failed;

bar.style.width=(sent/obj.total)*100+"%";

sentBox.innerText="Sent:"+sent;
failBox.innerText="Failed:"+failed;
}

status.innerText="Completed";

new Chart(chart,{
type:"pie",
data:{labels:["Sent","Failed"],datasets:[{data:[sent,failed]}]}
});

btn.disabled=false;
btn.innerText="Send Emails";
};

function downloadLogs(){
window.open("/export-logs");
}

</script>

</body>
</html>
